{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create account</h1>
  <form method="POST" class="stack">
    <label>Name<input type="text" name="name" required autofocus></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Password (6+ characters)<input type="password" name="password" minlength="6" required></label>
    <button type="submit">Create account</button>
  </form>
  <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
